name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel          # Intel (x86_64) — под Mac 2017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow requests

      - name: Convert icon to .icns
        run: |
          python -c "from PIL import Image; img = Image.open('icon.jpg'); img.save('icon.icns', format='ICNS')"

      - name: Build binary with PyInstaller (no --windowed)
        run: |
          pyinstaller --onedir --name "CatCutClient" client.py

      - name: Assemble distribution folder
        run: |
          set -e
          cd dist
          mv CatCutClient CatCutClient-macOS

          cat > CatCutClient-macOS/CatCutClient.command << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./CatCutClient
          echo
          echo "Нажмите Enter, чтобы закрыть..."
          read
          EOF

          chmod +x CatCutClient-macOS/CatCutClient.command
          chmod +x CatCutClient-macOS/CatCutClient

      - name: Ad-hoc sign all Mach-O binaries (fixes "damaged" error)
        run: |
          set -e
          TARGET="dist/CatCutClient-macOS"

          echo "=== Signing all Mach-O files ==="
          find "$TARGET" -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              echo "sign: $f"
              codesign --force --sign - "$f" || echo "  (skip: $f)"
            fi
          done

          echo "=== Signing bundle folder ==="
          codesign --force --deep --sign - "$TARGET" || true

          echo "=== Verifying signature ==="
          codesign --verify --deep --strict --verbose=2 "$TARGET"

      - name: Zip the distribution
        run: |
          cd dist
          zip -r --symlinks CatCutClient-macOS.zip CatCutClient-macOS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatCutClient-macOS
          path: dist/CatCutClient-macOS.zip
          if-no-files-found: error
