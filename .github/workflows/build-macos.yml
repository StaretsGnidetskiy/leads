name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow requests

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onedir --name "CatCutClient" client.py

      - name: Assemble distribution folder
        run: |
          cd dist
          mv CatCutClient CatCutClient-macOS

          cat > CatCutClient-macOS/CatCutClient.command << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./CatCutClient
          echo
          echo "Нажмите Enter, чтобы закрыть..."
          read
          EOF

          chmod +x CatCutClient-macOS/CatCutClient.command
          chmod +x CatCutClient-macOS/CatCutClient

      - name: Clean attributes and sign
        run: |
          TARGET="dist/CatCutClient-macOS"

          echo "=== Cleaning extended attributes ==="
          xattr -cr "$TARGET"

          echo "=== Signing all Mach-O files ==="
          find "$TARGET" -type f -exec sh -c '
            if file "$1" | grep -q "Mach-O"; then
              codesign --force --sign - "$1" || echo "  skip: $1"
            fi
          ' _ {} \;

          echo "=== Signature done ==="

      - name: Zip the distribution
        run: |
          cd dist
          zip -r --symlinks CatCutClient-macOS.zip CatCutClient-macOS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatCutClient-macOS
          path: dist/CatCutClient-macOS.zip
          if-no-files-found: error
